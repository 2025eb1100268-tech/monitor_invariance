[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-invariance"
version = "0.1.0"
description = "Checks for stateful runtime monitors of AI agents: clock vs count, sign constraint, evidence floor, budget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Manvendra Modgil" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/2025eb1100268-tech/monitor_invariance"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["monitor_invariance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
