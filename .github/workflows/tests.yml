name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test the installed package, not the checkout
        run: python -m pytest -q -p no:cacheprovider --import-mode=importlib
        working-directory: tests
      - name: Expect the full suite
        shell: python
        run: |
          import subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q", "tests"],
                               capture_output=True, text=True).stdout
          n = int(out.strip().splitlines()[-1].split()[0])
          print(n, "tests collected")
          sys.exit(0 if n == 129 else 1)
